<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}运单复制核对{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">运单复制核对台</div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'dashboard' }}">总览与操作</a>
      <a href="{{ url_for('reconcile_view') }}" class="{{ 'active' if active == 'reconcile' }}">按提交核对</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    核对结果始终取自所选提交的增量日志重放，不保存整表副本。
  </footer>
</body>
</html>
